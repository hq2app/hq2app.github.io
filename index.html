<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff1e2">
<title>Tiệm nhà Phụng</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧋</text></svg>">
<meta name="description" content="Tiệm nhà Phụng - game mở tiệm trà sữa vui nhộn">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff1e2; --bg2:#ffe2c9; --card:#fffaf4; --card2:#fff3e6; --ink:#3a2317; --ink2:#85624d;
  --line:#f0cfb2; --line2:#e2b48c;
  --accent:#ff6b5b; --accent-d:#d4473a; --mint:#1fae9a; --mint-d:#12857a; --gold:#f5b52a; --gold-d:#c78a0a;
  --good:#27a862; --warn:#f0a020; --bad:#e5484d;
  --wood:#c67a42; --wood2:#9e5a28; --woodtop:#e9a46b;
  --awn1:#ff7666; --awn2:#fff6ec;
  --glass:rgba(255,255,255,.5); --glass-stroke:#caa487; --steel:#b3a59c; --steel2:#8f8179;
  --shadow:rgba(110,55,20,.18); --overlay:rgba(58,30,18,.5); --neon:#ff4f8b;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1e1522; --bg2:#291d2e; --card:#322538; --card2:#2b2031; --ink:#fbeee3; --ink2:#c9ada0;
    --line:#46344e; --line2:#5c4566;
    --accent:#ff7a6b; --accent-d:#c2453a; --mint:#35c9b3; --mint-d:#1d8f7f; --gold:#f7c04a; --gold-d:#b28010;
    --good:#43c97c; --warn:#f4b13c; --bad:#ff6369;
    --wood:#86502e; --wood2:#5e341b; --woodtop:#a76a3f;
    --awn2:#3b2c44;
    --glass:rgba(255,255,255,.14); --glass-stroke:#9a8394; --steel:#76697a; --steel2:#5a4f5e;
    --shadow:rgba(0,0,0,.4); --overlay:rgba(8,4,12,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1522; --bg2:#291d2e; --card:#322538; --card2:#2b2031; --ink:#fbeee3; --ink2:#c9ada0;
  --line:#46344e; --line2:#5c4566;
  --accent:#ff7a6b; --accent-d:#c2453a; --mint:#35c9b3; --mint-d:#1d8f7f; --gold:#f7c04a; --gold-d:#b28010;
  --good:#43c97c; --warn:#f4b13c; --bad:#ff6369;
  --wood:#86502e; --wood2:#5e341b; --woodtop:#a76a3f;
  --awn2:#3b2c44;
  --glass:rgba(255,255,255,.14); --glass-stroke:#9a8394; --steel:#76697a; --steel2:#5a4f5e;
  --shadow:rgba(0,0,0,.4); --overlay:rgba(8,4,12,.65);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg2)}
body{height:100%;margin:0;background:var(--bg2);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg);box-shadow:0 0 40px var(--shadow)}

/* HUD */
.hud{display:flex;align-items:center;gap:6px;padding:8px 10px 6px;position:relative;z-index:6;background:var(--bg)}
.pill{display:flex;align-items:center;gap:5px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px;font-weight:900;font-size:14px;line-height:1.3;white-space:nowrap}
.pill .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.pill.money .ic{background:var(--gold);color:#6b4300}
.pill.money b{min-width:44px}
.pill.rep .ic{color:var(--gold);font-size:15px}
.pill.clock{flex:1;justify-content:center;position:relative;overflow:hidden;padding-left:10px;min-width:0}
.pill.clock i{position:absolute;left:0;bottom:0;height:3px;background:var(--mint);width:0}
.iconbtn{width:36px;height:36px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;flex:0 0 auto;padding:0}
.iconbtn svg{width:16px;height:16px}
.hint{font-size:13px;font-weight:800;color:var(--ink2);text-align:center;padding:0 12px 5px;min-height:23px;background:var(--bg);position:relative;z-index:6}
.hint:empty{min-height:0;padding:0}

/* Shopfront / street */
.front{position:relative;flex:1 1 auto;min-height:170px;max-height:380px;overflow:hidden;background:#bfe3ff}
.scene{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.cloud{animation:drift 70s linear infinite}
.cloud.c2{animation-duration:95s;animation-delay:-40s}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(540px)}}
.awning{position:absolute;left:0;right:0;top:0;height:30px;z-index:1;
  background:repeating-linear-gradient(90deg,var(--awn1) 0 26px,var(--awn2) 26px 52px);box-shadow:0 3px 6px rgba(0,0,0,.12)}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;
  background:radial-gradient(circle at 13px 0,var(--awn1) 12px,transparent 12.5px) 0 0/52px 10px repeat-x,
             radial-gradient(circle at 39px 0,var(--awn2) 12px,transparent 12.5px) 0 0/52px 10px repeat-x}
.sign{position:absolute;top:5px;left:50%;transform:translateX(-50%);z-index:2;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:0 10px;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;line-height:20px;color:var(--ink);white-space:nowrap}
.sign span{color:var(--neon)}
.front.neon .sign{box-shadow:0 0 0 2px var(--neon),0 0 16px var(--neon);animation:neonflick 4s infinite}
@keyframes neonflick{0%,92%,100%{box-shadow:0 0 0 2px var(--neon),0 0 16px var(--neon)}94%{box-shadow:0 0 0 2px var(--neon),0 0 2px var(--neon)}}
.slots{position:absolute;left:0;right:0;top:26px;bottom:0;display:flex;justify-content:center;gap:2px;padding:0 4px;z-index:2}
.slot{flex:1 1 0;max-width:160px;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:40px}
.cust{display:flex;flex-direction:column;align-items:center;width:100%;cursor:pointer;position:relative}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:5px 6px 6px;margin-bottom:5px;width:min(100%,130px);box-shadow:0 3px 0 var(--line);transition:border-color .2s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.brow{display:flex;align-items:center;gap:5px}
.mini{width:30px;height:38px;flex:0 0 auto}
.olabel{font-size:11px;line-height:1.25;font-weight:800;min-width:0;overflow:hidden}
.olabel b{display:block;font-weight:900;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.olabel span{display:block;color:var(--ink2);font-weight:900}
.badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;background:var(--ink);color:var(--card);border-radius:999px;padding:0 7px;line-height:17px;white-space:nowrap}
.say{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);border:2px solid var(--ink);font-size:11px;font-weight:900;line-height:1.25;
  padding:3px 8px;border-radius:12px;width:max-content;max-width:132px;text-align:center;z-index:5;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.pbar{height:5px;border-radius:9px;background:var(--line);margin-top:5px;overflow:hidden}
.pbar i{display:block;height:100%;width:100%;background:var(--good);border-radius:9px}
.pbar i.warn{background:var(--warn)} .pbar i.bad{background:var(--bad)}
.char{width:64px;height:80px}
.char.grp{width:82px}
.char svg{width:100%;height:100%;display:block;transform-origin:50% 100%;animation:breathe 2.4s ease-in-out infinite;overflow:visible}
.cust.mad .char svg{animation:fume .35s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.025)}}
@keyframes fume{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.front.ready .cust:not(.leaving) .bubble{border-color:var(--mint);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:translateY(-3px)}}
.counter{position:absolute;left:0;right:0;bottom:0;height:40px;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,var(--woodtop) 0 9px,var(--wood) 9px 100%);box-shadow:0 -2px 0 var(--wood2) inset}
.counter::before{content:"";position:absolute;left:0;right:0;top:9px;height:3px;background:var(--wood2);opacity:.6}
.counter::after{content:"";position:absolute;left:0;right:0;top:16px;bottom:0;background:repeating-linear-gradient(90deg,transparent 0 58px,rgba(0,0,0,.08) 58px 60px)}
.deco{position:absolute;pointer-events:none;display:none}
.front.d1 .deco.plant,.front.d2 .deco.plant,.front.d3 .deco.plant{display:block}
.front.d2 .deco.lantern,.front.d3 .deco.lantern{display:block}
.front.d3 .deco.lights{display:block}
.deco.plant{bottom:30px;width:34px;height:46px;z-index:4}
.deco.plant.l{left:4px} .deco.plant.r{right:4px}
.deco.lantern{top:30px;width:22px;height:40px;z-index:1;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}
.deco.lantern.l{left:14%} .deco.lantern.r{right:14%;animation-delay:-1.4s}
@keyframes sway{50%{transform:rotate(6deg)}}
.deco.lights{top:28px;left:0;width:100%;height:26px;z-index:1}
.lights circle{animation:twinkle 1.6s ease-in-out infinite}
.lights circle:nth-child(3n){animation-delay:-.5s}.lights circle:nth-child(3n+1){animation-delay:-1s}
@keyframes twinkle{50%{opacity:.35}}
.cat{position:absolute;bottom:34px;left:0;width:62px;height:44px;z-index:4;border:0;background:none;padding:0}
.cat svg{width:100%;height:100%;display:block;overflow:visible}
.cat .legA{animation:legs .26s ease-in-out infinite alternate}
.cat .legB{animation:legs .26s ease-in-out infinite alternate-reverse}
.cat .tail{transform-origin:8px 22px;animation:wag .6s ease-in-out infinite alternate}
@keyframes legs{to{transform:translateY(-2.5px)}}
@keyframes wag{to{transform:rotate(-18deg)}}

/* Work area */
.work{flex:0 0 auto;position:relative;display:flex;flex-direction:column;gap:6px;padding:6px 10px 10px;background:linear-gradient(180deg,#fcf1df,#f5e0c1);border-top:4px solid #8a5a36;color:#3a2317;z-index:4;transition:filter .4s}
.ticketrow{display:flex;align-items:center;gap:6px;min-height:30px}
.ticket{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:2px 0}
.ticket::-webkit-scrollbar{display:none}
.ticket .who{font-size:12px;font-weight:900;color:#5a3a22;background:#f3d6ab;border:2px solid #8a5a36;border-radius:8px;padding:1px 7px;flex:0 0 auto}
.chip{flex:0 0 auto;font-size:11.5px;font-weight:900;border-radius:999px;padding:1px 8px;background:#fffaf0;border:2px solid #d9b98f;color:#5a3a22;transition:background .2s}
.chip.ok{background:var(--good);border-color:var(--good);color:#fff}
.chip.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.ticket .idle{font-size:12.5px;font-weight:800;color:#8a6a52}
.qchip{border:2px solid #d9b98f;background:#fffaf0;border-radius:999px;font-weight:900;font-size:12.5px;padding:2px 10px;box-shadow:0 2px 0 #d9b98f;color:#3a2317;flex:0 0 auto}
.qchip.done{border-color:var(--good);color:var(--good)}
.rowlab{font-size:11.5px;font-weight:900;color:#5a3a22;margin:0 2px 3px;display:flex;align-items:baseline;gap:6px;letter-spacing:.2px}
.rowlab small{font-size:10.5px;color:#9a7a60;font-weight:800}
.jars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:68px;gap:6px}
.tray{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:56px;gap:6px;padding:5px;background:#aaa4ab;border:3px solid #7f7a80;border-radius:12px;box-shadow:0 4px 0 #5f5a62}
.jars.scroll,.tray.scroll{grid-template-columns:none;grid-auto-flow:column;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none}
.jars.scroll{grid-template-rows:repeat(2,68px);grid-auto-columns:calc((100% - 24px)/5.4)}
.tray.scroll{grid-template-rows:repeat(2,56px);grid-auto-columns:calc((100% - 30px)/6.4)}
.jars::-webkit-scrollbar,.tray::-webkit-scrollbar{display:none}
.tjar{border:0;background:none;padding:0 0 7px;position:relative;touch-action:pan-x;scroll-snap-align:start;min-width:0}
.tjar::after{content:"";position:absolute;left:-4px;right:-4px;bottom:0;height:8px;background:linear-gradient(#e9c89a,#d2a570);border-top:2px solid #8a5a36;border-bottom:2px solid #8a5a36}
.tjar svg{width:100%;height:100%;display:block;pointer-events:none;transform-origin:50% 90%}
.jlab{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:94%;background:#fffaf0;border:1.5px solid #8a5a36;border-radius:4px;font-size:10px;font-weight:900;line-height:1.1;padding:2px 1px;color:#3a2317;text-align:center;pointer-events:none}
.tjar.pressing svg{animation:tilt .25s ease-in-out infinite alternate}
.tjar.pressing .jlab{border-color:var(--mint);background:#e9fff8}
@keyframes tilt{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.tjar.need .jlab{background:#ffe9a8;border-color:#f08a24;box-shadow:0 0 0 3px rgba(240,138,36,.35)}
.tjar.need svg,.cell.need,.cupstack.need,.machine.ready{animation:needbob 1s ease-in-out infinite}
@keyframes needbob{50%{transform:translateY(-3px)}}
.addmore{border:2px dashed #c9a47a;border-radius:10px;background:rgba(255,255,255,.4);color:#8a6a52;font-weight:900;font-size:10.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15;padding:2px;margin-bottom:7px}
.tray .addmore{margin:0;border-color:#e9e5e9;background:rgba(255,255,255,.3);color:#fff}
.addmore b{font-size:20px;line-height:1}
.prep{display:flex;gap:8px;align-items:stretch;height:150px}
.cups{display:flex;flex-direction:column;gap:6px;flex:0 0 54px}
.cupstack{flex:1;min-height:0;border:2px solid #d9b98f;background:#fffaf0;border-radius:12px;padding:3px 2px;position:relative;display:flex;align-items:center;justify-content:center;gap:1px;touch-action:manipulation;box-shadow:0 3px 0 #d9b98f}
.cupstack svg{height:100%;width:auto;max-width:26px;display:block}
.cupstack b{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;color:#3a2317;line-height:1}
.cupstack:active{transform:translateY(2px);box-shadow:0 1px 0 #d9b98f}
.cups.ready .cupstack{border-color:var(--mint)}
.cupstack.need{border-color:#f08a24;background:#ffe9a8}
.board{flex:1 1 auto;min-width:0;position:relative;border-radius:14px;background:repeating-linear-gradient(90deg,#eac18a 0 16px,#e2b67c 16px 18px);border:3px solid #a8703f;box-shadow:0 4px 0 #8a5a36,inset 0 0 0 3px rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;padding:10px 7px 7px}
.bempty{position:absolute;inset:0 0 26px;display:grid;place-items:center;text-align:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;color:#6b4424;line-height:1.2;pointer-events:none}
.board.has .bempty{display:none}
.combo{position:absolute;right:6px;top:6px;z-index:3;background:var(--accent);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;border-radius:12px;padding:0 8px;font-size:15px;line-height:1.4;box-shadow:0 3px 0 var(--accent-d);opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);display:flex;align-items:center;gap:4px;pointer-events:none}
.combo.on{opacity:1;transform:scale(1)}
.combo small{font-size:10px;font-family:'Nunito',sans-serif;font-weight:900;opacity:.9}
.combo .cb{width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.combo .cb i{display:block;height:100%;background:#fff}
.cupwrap{flex:1 1 auto;min-height:0;width:100%;position:relative}
.cupwrap svg{width:100%;height:100%;display:block;overflow:visible;transform:scale(var(--cs,1));transform-origin:50% 100%;transition:transform .2s}
.cupwrap.flying{z-index:60}
.cupwrap.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.fill{width:100%;display:flex;align-items:center;gap:4px;margin-top:5px}
.ftrack{flex:1;height:11px;border-radius:6px;background:#6b4424;position:relative;border:2px solid #3a2317}
.fzone{position:absolute;top:0;bottom:0;left:80%;width:16%;background:#5fd08a}
.fknob{position:absolute;top:-6px;width:11px;height:19px;border-radius:3px;background:#fffaf0;border:2px solid #3a2317;left:0;margin-left:-5.5px;transition:background .15s}
.fill b{font-size:11px;font-weight:900;color:#3a2317;min-width:30px;text-align:right}
.board.perfect .fknob{background:var(--good)} .board.over .fknob{background:var(--bad)}
.tools{display:flex;flex-direction:column;gap:6px;flex:0 0 72px}
.machine{flex:1;min-height:0;border:2px solid #d9b98f;background:#fffaf0;border-radius:12px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 #d9b98f;touch-action:manipulation;position:relative}
.machine svg{height:calc(100% - 15px);width:auto;max-width:62px;overflow:visible;display:block}
.mlab{font-size:10px;font-weight:900;color:#5a3a22;white-space:nowrap}
.machine:active{transform:translateY(2px);box-shadow:0 1px 0 #d9b98f}
.machine.ready{border-color:var(--mint);background:#e9fff8;box-shadow:0 3px 0 var(--mint)}
.machine.ready .mlab{color:#12857a}
.bin{flex:0 0 38px;border:2px solid #d9b98f;background:#fffaf0;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:900;color:#5a3a22;box-shadow:0 3px 0 #d9b98f;padding:0}
.bin svg{width:22px;height:20px;display:block}
.bin:active{transform:translateY(2px);box-shadow:0 1px 0 #d9b98f}
.cell{border:0;padding:0;border-radius:7px;background:none;position:relative;touch-action:pan-x;scroll-snap-align:start;min-width:0}
.cell svg{width:100%;height:100%;display:block;border-radius:7px;pointer-events:none}
.clab{position:absolute;left:2px;right:2px;bottom:2px;font-size:9.5px;font-weight:900;color:#3a2317;background:rgba(255,250,240,.92);border-radius:4px;line-height:1.35;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.cell:active{transform:scale(.93)}
.cell.need{outline:3px solid #f08a24;outline-offset:1px}
.stk{position:absolute;top:1px;right:1px;font-style:normal;font-size:10px;font-weight:900;line-height:15px;min-width:19px;height:18px;padding:0 4px;border-radius:9px;background:#fffaf0;color:#5a3a22;border:1.5px solid #8a5a36;text-align:center;pointer-events:none;z-index:2}
.cupstack .stk{top:-7px;right:-6px}
.stk.low{background:#fff1d6;color:#a86400;border-color:var(--warn)}
.out>svg{filter:grayscale(.85) opacity(.55)}
.out .stk{background:var(--bad);color:#fff;border-color:var(--bad)}
.cell.out::after{content:"Hết";position:absolute;inset:0;display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;color:#5a3a22;font-size:14px;pointer-events:none}
.coming .stk{background:var(--mint);color:#fff;border-color:var(--mint)}
.rip{position:absolute;border-radius:50%;background:var(--mint);opacity:.35;pointer-events:none;width:20px;height:20px;margin:-10px 0 0 -10px;z-index:3}

/* ================= CUSTOMERS ================= */
function chooseType() {
  const d = S.day, ev = EVENTS[run.event];
  const w = {hs:3 * (ev.hs || 1), vp:3 * (ev.vp || 1), ship:d >= 2 ? 2 : 0, co:2, chu:d >= 3 ? 1.5 : 0, rv:d >= 4 ? .45 : 0,
    tay:d >= 5 ? .8 * (ev.tay || 1) : (ev.tay ? 2 : 0), nhom:d >= 3 ? 1.1 * (ev.nhom || 1) : 0};
  let sum = 0; for (const k in w) sum += w[k];
  let r = Math.random() * sum;
  for (const k in w) { r -= w[k]; if (r <= 0) return k; }
  return 'vp';
}
function makeOrder(type) {
  const d = S.day;
  const size = Math.random() < (type === 'ship' ? .25 : .4) ? 'L' : 'M';
  if (d >= 3 && ['hs', 'vp', 'tay'].includes(type) && Math.random() < .12) return {free:true, size, tops:[], price:0};
  const base = pick(S.bases), B = BASES[base];
  const milk = B.milk === 'always' ? true : B.milk === 'never' ? false : Math.random() < .58;
  const avail = S.tops.filter(t => t !== 'cheese');
  let n = Math.random() < (d === 1 ? .5 : .7) ? 1 : 0;
  const twoChance = d >= 6 ? .35 : d >= 3 ? .2 : 0;
  if (n && Math.random() < twoChance + (EVENTS[run.event].extraTop ? .3 : 0)) n = 2;
  if (type === 'ship' || type === 'nhom') n = Math.min(n, 1);
  const tops = [];
  if (base === 'dao' && avail.includes('daomieng') && Math.random() < .6) tops.push('daomieng');
  while (tops.length < n && tops.length < avail.length) { const t = pick(avail); if (!tops.includes(t)) tops.push(t); }
  if (S.tops.includes('cheese') && type !== 'ship' && Math.random() < .25) tops.push('cheese');
  const o = {base, milk, tops, size};
  o.price = priceOf(o);
  return o;
}
function orderName(o) {

}

/* ================= SERVING ================= */
function evaluate(o) {
  const tot = cupTotal();
  if (cup.size !== o.size) return {ok:false, reason:`Khách gọi size ${o.size}`};
  const teas = Object.keys(cup.tea).filter(k => cup.tea[k] > 3);
  if (tot < 1 || !teas.length) return {ok:false, reason:'Ly chưa có trà'};
  if (teas.length > 1) return {ok:false, reason:'Lỡ pha lẫn hai loại trà'};
  const mf = cup.milk / tot, perfect = !cup.spilled && tot >= PERF_LO && tot <= PERF_HI;
  if (o.free) {
    const B = BASES[teas[0]];
    if (B.milk === 'always' && mf < .12) return {ok:false, reason:`${B.name} phải có sữa`};
    if (B.milk === 'never' && cup.milk > 3) return {ok:false, reason:`${B.name} không hợp với sữa`};
    if (mf > .7) return {ok:false, reason:'Hơi nhiều sữa nên nhạt trà'};
    if (tot < MIN_OK) return {ok:false, reason:'Ly còn vơi quá'};
    return {ok:true, perfect, free:true, base:teas[0], milk:mf >= .12, tops:Object.keys(cup.tops)};
  }
  if (teas[0] !== o.base) return {ok:false, reason:`Khách gọi ${BASES[o.base].name}`};
  if (o.milk && mf < .12) return {ok:false, reason:'Món này cần thêm sữa'};
  if (o.milk && mf > .7) return {ok:false, reason:'Hơi nhiều sữa nên nhạt trà'};
  if (!o.milk && cup.milk > 3) return {ok:false, reason:'Khách không dùng sữa'};
  for (const k of o.tops) if (!cup.tops[k]) return {ok:false, reason:`Thiếu ${TOPS[k].name.toLowerCase()}`};
  for (const k in cup.tops) if (!o.tops.includes(k)) return {ok:false, reason:`Khách không gọi ${TOPS[k].name.toLowerCase()}`};
  if (tot < MIN_OK) return {ok:false, reason:'Ly còn vơi quá'};
  return {ok:true, perfect};
}
function serve(i) {
  if (!canWork()) return;
  const c = run.slots[i];
  if (!c || c.state !== 'wait') return;
  if (!cup.sealed) {
    const tot = cupTotal();
    if (cup.size && tot >= MIN_OK && S.upg.auto && run.event !== 'blackout') { setFocus(c); sealCup(() => deliver(c)); return; }
    const was = run.focus === c.id;
    setFocus(c, true);
    if (was) {
      toast(!cup.size ? `Chạm chồng ly size ${c.order.size} để bắt đầu nha` : tot < MIN_OK ? 'Rót thêm tới vạch xanh nha' : 'Bấm máy ĐÓNG NẮP rồi mới giao được nha');
      if (cup.size && tot >= MIN_OK) shakeEl(machineEl);
    }
    return;
  }
  deliver(c);
}
function deliver(c) {
  if (!run || !run.active || c.state !== 'wait') return;
  stopPour();
  run.busy = true; c.serving = true;
  const res = evaluate(c.order);
  cupWrap.classList.add('flying');
  const a = cupWrap.getBoundingClientRect(), b = c.el.querySelector('.char').getBoundingClientRect();
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height * .6) - (a.top + a.height / 2);
  const an = cupWrap.animate([{transform:'none', opacity:1}, {transform:`translate(${dx * .5}px,${dy * .5 - 60}px) scale(.6) rotate(-12deg)`, offset:.5}, {transform:`translate(${dx}px,${dy}px) scale(.26) rotate(10deg)`, opacity:.9}], {duration:440, easing:'cubic-bezier(.4,0,.6,1)'});
  an.onfinish = () => { cupWrap.classList.remove('flying'); resolveServe(c, res); resetCup(); if (run) run.busy = false; };
}
function hoangFine() {
  setTimeout(() => toast('📋 Hoàng nhắc nhẹ: lần sau chú ý hơn là được nha'), 600);
}
function slotPoint(c) {
  const r = c.el.querySelector('.char').getBoundingClientRect(), a = app.getBoundingClientRect();
  return {x:r.left - a.left + r.width / 2, y:r.top - a.top + r.height * .25};
}
function resolveServe(c, res) {
  c.serving = false;
  const p = slotPoint(c), T = CTYPES[c.type], ev = EVENTS[run.event];
  if (!res.ok) {
    floatText('Ối, nhầm món rồi', p.x, p.y - 30, 'bad');
    addReview(c, 1, 'wrong', {reason:res.reason});
    if (c.type === 'hoang') hoangFine(p);
    floatText(res.reason, p.x, p.y - 6, 'small', 1700);
    sfx.bad(); buzz([30, 40, 30]); screenShake(6);

  if (res.free) {

  const frac = c.pat / c.patMax;

  if (cup.spilled) st--;
  st = clamp(st, 1, 5);
  if (st >= 5) run.combo++; else if (st <= 3) run.combo = 0;
  S.stats.maxCombo = Math.max(S.stats.maxCombo, run.combo);
  if (res.perfect) S.stats.perfect++;
  const comboMul = 1 + .1 * Math.min(Math.max(run.combo - 1, 0), 10);
  const tipRate = [0, 0, 0, .05, .12, .25][st];
  let tip = c.order.price * tipRate * T.tip * (1 + .25 * (S.upg.tip || 0)) * (ev.tip || 1) * comboMul;
  if (c.type === 'rv' && st === 5) tip += 30;
  if (c.order.free) tip = tip * (1 + .15 * c.order.tops.length) + 3 * c.order.tops.length;
  const mul = fever() ? 2 : 1;
  tip = Math.round(tip * mul);
  const price = c.order.price * mul;
  const pay = price + tip;
  S.money += pay; run.earned += pay; run.revenue += price; run.tips += tip; run.served++; S.served++; S.stats.earned += pay;
  run.stars.push(st);
  pushRating(st, c.type === 'rv' ? 3 : 1);
  addReview(c, st, 'ok', {perfect:res.perfect, spilled:cup.spilled, frac});
  addXP(st + (res.perfect ? 1 : 0));
  updateCombo();
  floatText('+' + fmt(pay), p.x, p.y - 30, mul > 1 ? 'gold' : 'money');
  floatText('★'.repeat(st) + '☆'.repeat(5 - st), p.x, p.y - 6, 'stars');
  if (res.perfect) floatText('Hoàn hảo!', p.x, p.y + 16, 'perfect');
  flyCoins(p.x, p.y, Math.min(8, 2 + Math.floor(pay / 12)));
  if (st === 5) confetti(p.x, p.y, 14);
  sfx.coin(); buzz(15);
  if (run.combo >= 2) {
    sfx.combo(run.combo);
    if (run.combo % 5 === 0 || run.combo === 3) floatText(`Combo x${run.combo}!`, app.clientWidth / 2, p.y + 40, 'big', 900);
  }
  if (run.combo >= 5 && run.combo % 5 === 0 && !fever()) startFever();
  // quests
  qAdd('perfect', res.perfect ? 1 : 0); qAdd('base:' + c.order.base, 1); c.order.tops.forEach(k => qAdd('top:' + k, 1));
  qAdd('tips', tip); qAdd('five', st === 5 ? 1 : 0); if (c.type === 'ship' && st >= 4) qAdd('ship', 1);
  qMax('combo', run.combo); qAdd('earn', pay);
  if (c.type === 'rv') {
    if (st === 5) { S.stats.rv5++; toast('📹 Video review lên xu hướng! Khách sẽ kéo tới đông hơn', 'gold'); pushRating(5, 3); }
    else toast('📹 Reviewer chưa ưng lắm, lần sau mình làm tốt hơn nha');
  }
  if (c.type === 'hoang') {
    if (st >= 4) {
      const g = 30 + S.day * 5; S.money += g; run.earned += g; S.stats.mom++;
      confetti(p.x, p.y, 18);
      setTimeout(() => toast(`📋 Hoàng chấm ĐẠT CHUẨN! Thưởng ${fmt(g)}`, 'gold', 2600), 500);
    } else hoangFine(p);
  }
  const key = [c.order.base, c.order.milk ? 1 : 0, ...[...c.order.tops].sort()].join('|');

  } else leave(c, true);
  updateHUD();
}

function genQuests() {

  const b = pick(S.bases); pool.push({id:'base:' + b, text:`Bán ${2 + Math.floor(d / 4)} ly ${BASES[b].name.toLowerCase()}`, n:2 + Math.floor(d / 4)});
  const tp = pick(S.tops); pool.push({id:'top:' + tp, text:`Bán ${2 + Math.floor(d / 4)} ly có ${TOPS[tp].name.toLowerCase()}`, n:2 + Math.floor(d / 4)});
  pool.push({id:'tips', text:`Nhận ${fmt(10 + d * 6)} tiền tip`, n:10 + d * 6, money:true});

}

function tick(dt) {

    else cup.tea[sk] = (cup.tea[sk] || 0) + amt;
    S.stock[sk] = Math.max(0, stk(sk) - amt * sizeMul() / 100);

  if (run && run.active && !run.paused) tick(dt);
  if (Math.abs(dispMoney - S.money) > .5) { dispMoney += (S.money - dispMoney) * Math.min(1, dt * 9); } else dispMoney = S.money;
  $('#hMoney').textContent = fmt(dispMoney);
  requestAnimationFrame(frame);
}

function runCountUps() {
  const els = [...screen.querySelectorAll('[data-count]')];
  const t0 = performance.now(), D = 900;
  let lastTick = 0;
  const step = now => {
    const k = clamp((now - t0) / D, 0, 1), e = 1 - Math.pow(1 - k, 3);
    els.forEach(el => { const v = Math.round(+el.dataset.count * e); el.textContent = el.dataset.k ? fmt(v) : v; });
    if (now - lastTick > 70 && k < 1) { sfx.tick(); lastTick = now; }
    if (k < 1 && screen.contains(els[0])) requestAnimationFrame(step);
  };
  if (els.length) requestAnimationFrame(step);
}

function buy(kind, id) {
  let cost = 0;
  if (kind === 'base') { if (S.bases.includes(id)) return; cost = BASES[id].cost; if (S.lvl < (BASES[id].lvl || 0)) return; }
  if (kind === 'top') { if (S.tops.includes(id)) return; cost = TOPS[id].cost; if (S.lvl < (TOPS[id].lvl || 0)) return; }
  if (kind === 'upg') { const u = UPGRADES.find(x => x.id === id), l = S.upg[id] || 0; if (l >= u.costs.length || S.lvl < (u.lvl || 0)) return; cost = u.costs[l]; }
  if (kind === 'theme') { if (S.themes.includes(id) || S.lvl < (THEMES[id].lvl || 0)) return; cost = THEMES[id].cost; }
  if (S.money < cost) { sfx.bad(); return; }
  S.money -= cost;
  if (kind === 'base') S.bases.push(id);
  if (kind === 'top') S.tops.push(id);

  if (kind === 'wrong') tags.push('🙈 Nhầm món');

  S.gift = {last:dstr(Date.now()), streak:n};
  S.money += v;
  if (S.tops.includes('tcden')) S.stock.tcden = Math.min(capFor(), stk('tcden') + 5);
  persist();
  sfx.fanfare(); confetti(app.clientWidth / 2, app.clientHeight * .45, 36);
  toast(`🎁 Quà ngày ${n}: +${fmt(v)} và 5 phần trân châu đen`, 'gold', 2600);
  showMenu();
}

/* ================= ACTIONS ================= */
let backTo = null;
document.addEventListener('pointerdown', () => { if (!interacted) { interacted = true; ctx(); Music.start(); } }, true);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  interacted = true; ctx(); Music.start();
  if (!['pause', 'trash', 'jar', 'buy', 'claim', 'mbuy', 'mfill', 'rvreply', 'gift', 'rushYes', 'seal'].includes(act)) sfx.click();
  switch (act) {
    case 'play': if (!S.tut) { showHowto(true); return; } showIntro(); break;
    case 'howtoDone': S.tut = true; persist(); showIntro(); break;
    case 'begin': beginDay(); break;
    case 'menu': showMenu(); break;
    case 'shop': settleJar(); backTo = 'menu'; showShop(); break;
    case 'tab': shopTab = b.dataset.tab; showShop(); screen.querySelector('.panel').style.animation = 'none'; break;
    case 'book': backTo = 'menu'; showBook(); break;
    case 'ach': backTo = 'menu'; showAch(); break;
    case 'settings': backTo = 'menu'; showSettings(); break;
    case 'howto': backTo = 'menu'; showHowto(false); break;
    case 'howto2': backTo = 'settings'; showHowto(false); break;
    case 'back':
      if (backTo === 'settings') { backTo = 'menu'; showSettings(); }
      else showMenu();
      break;
    case 'buy': buy(b.dataset.kind, b.dataset.id); break;
    case 'useTheme': S.theme = b.dataset.id; persist(); applyTheme(); showShop(true); toast('Đã đổi phong cách quán!', 'good', 1400); break;
    case 'claim': {
      const a = ACHS.find(x => x.id === b.dataset.id); if (!a || S.ach[a.id] || !S.achSeen[a.id]) return;
      S.ach[a.id] = true; S.money += a.r; persist();
      const r = b.getBoundingClientRect(), ap = app.getBoundingClientRect();
      confetti(r.left - ap.left + r.width / 2, r.top - ap.top, 20); sfx.coin(); sfx.quest();
      showAch(true); break;
    }
    case 'toggle': {
      const k = b.dataset.key; S[k] = !S[k]; persist();
      if (k === 'sound' && !S.sound) sfx.pourStop();
      if (k === 'music') S.music ? Music.start() : Music.stop();
      if (k === 'vibe' && S.vibe) buzz(30);
      if (k === 'assist') lastTicket = '';
      b.classList.toggle('on', S[k]); b.setAttribute('aria-checked', S[k]);
      break;
    }
    case 'soundP': S.sound = !S.sound; persist(); if (!S.sound) sfx.pourStop(); showPause(); break;
    case 'musicP': S.music = !S.music; persist(); S.music ? Music.start() : Music.stop(); showPause(); break;
    case 'pause': showPause(); break;
    case 'resume': resume(); break;
    case 'jar': openJar(); break;
    case 'quit':
      if (snapshot) { const keep = {sound:S.sound, music:S.music, vibe:S.vibe}; S = JSON.parse(snapshot); Object.assign(S, keep); persist(); snapshot = null; }
      removeCat(); run = null; slotsEl.innerHTML = ''; resetCup(); updateCombo(); showMenu(); break;
    case 'trash':
      if (!canWork()) return;
      if (!cup.size) { toast('Trên thớt chưa có ly nào'); return; }
      stopPour(); sfx.trash(); buzz(15);
      run.busy = true;
      cupWrap.classList.add('flying');
      cupWrap.animate([{transform:'none'}, {transform:'translate(-10px,-50px) rotate(-60deg) scale(.7)', offset:.5}, {transform:'translate(-20px,-90px) rotate(-120deg) scale(.3)', opacity:0}], {duration:360, easing:'ease-in'}).onfinish = () => { cupWrap.classList.remove('flying'); resetCup(); if (run) run.busy = false; };
      $('.bin').animate([{transform:'none'}, {transform:'rotate(-12deg)'}, {transform:'rotate(8deg)'}, {transform:'none'}], {duration:400});
      break;
    case 'seal': sealCup(); break;
    case 'morehint': toast('Mở thêm món mới ở Cửa hàng ngoài màn hình chính nha'); break;
    case 'rank': backTo = 'menu'; showRank(); break;
    case 'market': marketBack = 'menu'; showMarket(); break;
    case 'market2': marketBack = 'intro'; showMarket(); break;
    case 'mback': if (marketBack === 'intro' && run && !run.active) renderIntro(); else showMenu(); break;
    case 'mbuy': {
      const k = b.dataset.key, q = +b.dataset.q, c = Math.ceil(q * unitPrice(k));
      if (q < 1 || S.money < c) return;
      S.money -= c; S.spentToday += c; S.stock[k] = stk(k) + q; persist();
      sfx.coin(); buzz(10);
      const r = b.getBoundingClientRect(), ap = app.getBoundingClientRect(); floatText('+' + q, r.left - ap.left + r.width / 2, r.top - ap.top, 'money', 700);
      showMarket(true); break;
    }
    case 'mfill': {
      const cap = capFor(); let spent = 0;
      stockKeys().forEach(k => { const p = unitPrice(k); let q = Math.floor(capOf(k) - stk(k)); while (q > 0 && Math.ceil(q * p) > S.money) q--; if (q > 0) { const c = Math.ceil(q * p); S.money -= c; spent += c; S.stock[k] = stk(k) + q; } });
      S.spentToday += spent; persist();
      if (spent) { sfx.buy(); confetti(app.clientWidth / 2, app.clientHeight * .3, 16); toast(`Đã nhập hàng · ${fmt(spent)}`, 'good', 1500); }
      showMarket(true); break;
    }
    case 'reviews': backTo = 'menu'; rvTab = 'all'; rvOpen = null; showReviews(); break;
    case 'rvtab': rvTab = b.dataset.tab; rvOpen = null; showReviews(); screen.querySelector('.panel').style.animation = 'none'; break;
    case 'rvopen': rvOpen = b.dataset.id; showReviews(true); break;
    case 'rvreply': replyReview(b.dataset.id, +b.dataset.o); break;
    case 'gift': claimGift(); break;
    case 'rushYes': {
      const k = b.dataset.key, q = +b.dataset.qty, c = +b.dataset.cost;
      if (!run || S.money < c) return;
      S.money -= c; S.spentToday += c; run.deliveries.push({key:k, qty:q, t:5});
      resume(); spawnScooter(); updateStockUI(); toast('🛵 Shipper Giao Lẹ đang chạy tới!'); break;
    }
    case 'reset':
      showScreen(`<div class="panel"><h2>Chơi lại từ đầu?</h2><p class="sub">Toàn bộ tiền, cấp độ, món đã mở và thành tích sẽ bị xoá.</p>
        <div class="row2"><button class="btn ghost" data-act="menu">Giữ lại</button><button class="btn" data-act="resetYes">Xoá hết</button></div></div>`);
      break;
    case 'resetYes': { const keep = {sound:S.sound, music:S.music, vibe:S.vibe}; S = Object.assign(fresh(), keep); ensureStock(); persist(); applyDecor(); applyTheme(); showMenu(); break; }
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (run && run.active && !run.paused) showPause(); Music.stop(); }
  else Music.start();
});
window.addEventListener('blur', () => stopPour());
document.addEventListener('keydown', e => { if (e.key === 'Escape' && run && run.active) { run.paused ? resume() : showPause(); } });

/* ================= BOOT ================= */
ensureStock();
(() => { let r = ''; for (let i = 0; i < 90; i++) { const x = rnd(0, 440), y = rnd(-40, 260); r += `<path d="M${x.toFixed(0)} ${y.toFixed(0)} l-5 16"/>`; } $('#rain').innerHTML = `<g stroke="#d6ecff" stroke-width="1.5" stroke-linecap="round" opacity=".8">${r}</g>`; })();
buildSlots(); buildTrays(); applyDecor(); applyTheme(); renderCup(); updateHUD(); updateScene(.3);
qchip.style.display = 'none';
showMenu();
})();
</script>
</body>
</html>
